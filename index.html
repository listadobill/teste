<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV DO BILL - IPTV Player Web</title>
  
  <!-- Meta tags para melhor SEO e compatibilidade -->
  <meta name="description" content="TV DO BILL - Player IPTV Web compatível com Smart TVs, celulares e computadores">
  <meta name="keywords" content="IPTV, Player, TV, Streaming, Web">
  <meta name="author" content="Bill">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
  
  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">
  
  <style>
    /* Reset e configurações básicas */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      margin: 0; 
      display: flex; 
      height: 100vh; 
      background: #000;
      color: #fff;
      overflow: hidden;
    }
    
    /* Sidebar - mantendo o layout original */
    #sidebar { 
      width: 300px; 
      background: #111; 
      color: #fff; 
      overflow-y: auto; 
      padding: 10px;
      border-right: 1px solid #333;
      flex-shrink: 0;
    }
    
    /* Player container - mantendo o layout original */
    #player { 
      flex: 1; 
      background: #000; 
      display: flex; 
      flex-direction: column;
      position: relative;
    }
    
    /* Video player - usando Video.js mas mantendo aparência original */
    .video-js {
      width: 100% !important;
      height: 100% !important;
      background: #000;
    }
    
    .video-js .vjs-tech {
      width: 100% !important;
      height: 100% !important;
    }
    
    /* Canais - mantendo estilo original */
    .channel { 
      padding: 8px; 
      border-bottom: 1px solid #333; 
      cursor: pointer;
      transition: background-color 0.2s ease;
      user-select: none;
    }
    
    .channel:hover { 
      background: #222; 
    }
    
    .channel.active {
      background: #333;
      border-left: 3px solid #fff;
    }
    
    /* Header do sidebar */
    #sidebar h3 {
      margin-bottom: 10px;
      text-align: center;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    
    #sidebar p {
      margin-bottom: 15px;
      font-size: 14px;
      color: #ccc;
      text-align: center;
    }
    
    /* Status messages */
    .status-message {
      padding: 8px;
      margin: 5px 0;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    
    .status-success {
      background: rgba(0, 255, 0, 0.1);
      color: #0f0;
      border: 1px solid rgba(0, 255, 0, 0.3);
    }
    
    .status-error {
      background: rgba(255, 0, 0, 0.1);
      color: #f00;
      border: 1px solid rgba(255, 0, 0, 0.3);
    }
    
    .status-warning {
      background: rgba(255, 255, 0, 0.1);
      color: #ff0;
      border: 1px solid rgba(255, 255, 0, 0.3);
    }
    
    .status-info {
      background: rgba(0, 0, 255, 0.1);
      color: #0ff;
      border: 1px solid rgba(0, 0, 255, 0.3);
    }
    
    /* Loading animation */
    .loading {
      text-align: center;
      color: #ccc;
    }
    
    .loading::after {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #333;
      border-top: 2px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 8px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Responsividade para Smart TVs e dispositivos móveis */
    @media screen and (max-width: 768px) {
      body {
        flex-direction: column;
      }
      
      #sidebar {
        width: 100%;
        height: 200px;
        order: 2;
        border-right: none;
        border-top: 1px solid #333;
      }
      
      #player {
        order: 1;
        height: calc(100vh - 200px);
      }
    }
    
    /* Otimizações para Smart TVs */
    @media screen and (min-width: 1920px) {
      #sidebar {
        width: 400px;
      }
      
      .channel {
        padding: 12px;
        font-size: 16px;
      }
      
      #sidebar h3 {
        font-size: 24px;
      }
    }
    
    /* Melhorias de acessibilidade */
    .channel:focus {
      outline: 2px solid #fff;
      background: #222;
    }
    
    /* Esconder scrollbar mas manter funcionalidade */
    #sidebar::-webkit-scrollbar {
      width: 8px;
    }
    
    #sidebar::-webkit-scrollbar-track {
      background: #111;
    }
    
    #sidebar::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }
    
    #sidebar::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
    
    /* Overlay para mensagens importantes */
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      z-index: 1000;
      max-width: 80%;
    }
    
    .overlay.hidden {
      display: none;
    }
    
    /* Botão de play customizado */
    .custom-play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      font-size: 30px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s ease;
    }
    
    .custom-play-button:hover {
      background: rgba(255, 255, 255, 1);
      transform: translate(-50%, -50%) scale(1.1);
    }
    
    .custom-play-button.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h3>📺 TV DO BILL</h3>
    <p>IPTV Player Web</p>
    <div id="status" class="loading">Carregando canais...</div>
    <div id="channelList"></div>
  </div>
  
  <div id="player">
    <video
      id="video"
      class="video-js vjs-default-skin"
      controls
      preload="none"
      data-setup='{"fluid": true, "responsive": true, "playbackRates": [0.5, 1, 1.25, 1.5, 2]}'
    >
      <p class="vjs-no-js">
        Para visualizar este vídeo, ative o JavaScript e considere atualizar para um
        <a href="https://videojs.com/html5-video-support/" target="_blank">
          navegador que suporte vídeo HTML5
        </a>.
      </p>
    </video>
    
    <!-- Botão de play customizado -->
    <button id="customPlayButton" class="custom-play-button hidden">▶</button>
    
    <!-- Overlay para mensagens -->
    <div id="overlay" class="overlay hidden">
      <div id="overlayMessage"></div>
    </div>
  </div>

  <!-- Scripts externos -->
  <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <script>
    // Configuração global
    const CONFIG = {
      M3U_URL: "https://raw.githubusercontent.com/listadobill/tv/refs/heads/main/zteste.m3u",
      AUTO_PLAY_FIRST: false, // Desabilitado para evitar problemas de autoplay
      RETRY_ATTEMPTS: 3,
      RETRY_DELAY: 2000
    };
    
    // Elementos DOM
    const elements = {
      channelList: document.getElementById('channelList'),
      status: document.getElementById('status'),
      customPlayButton: document.getElementById('customPlayButton'),
      overlay: document.getElementById('overlay'),
      overlayMessage: document.getElementById('overlayMessage')
    };
    
    // Estado global
    const state = {
      channels: [],
      currentChannelIndex: -1,
      player: null,
      hls: null,
      dashPlayer: null,
      isLoading: false,
      retryCount: 0
    };
    
    // Utilitários
    const utils = {
      // Detectar tipo de dispositivo
      getDeviceType() {
        const userAgent = navigator.userAgent.toLowerCase();
        if (userAgent.includes('smart-tv') || userAgent.includes('smarttv')) return 'smarttv';
        if (userAgent.includes('mobile') || userAgent.includes('android') || userAgent.includes('iphone')) return 'mobile';
        return 'desktop';
      },
      
      // Verificar se é HTTPS
      isHTTPS() {
        return location.protocol === 'https:';
      },
      
      // Detectar tipo de stream
      detectStreamType(url) {
        if (url.includes('.m3u8') || url.includes('m3u8')) return 'hls';
        if (url.includes('.mpd') || url.includes('mpd')) return 'dash';
        if (url.includes('.ts')) return 'ts';
        if (url.includes('.mp4')) return 'mp4';
        return 'unknown';
      },
      
      // Logging melhorado
      log(level, message, data = null) {
        const timestamp = new Date().toISOString();
        console[level](`[${timestamp}] TV DO BILL: ${message}`, data || '');
      }
    };
    
    // Gerenciador de status
    const statusManager = {
      show(message, type = 'info', duration = 0) {
        elements.status.className = `status-message status-${type}`;
        elements.status.textContent = message;
        
        if (duration > 0) {
          setTimeout(() => {
            this.clear();
          }, duration);
        }
        
        utils.log('info', `Status: ${message} (${type})`);
      },
      
      clear() {
        elements.status.className = '';
        elements.status.textContent = '';
      },
      
      showOverlay(message, duration = 3000) {
        elements.overlayMessage.textContent = message;
        elements.overlay.classList.remove('hidden');
        
        if (duration > 0) {
          setTimeout(() => {
            elements.overlay.classList.add('hidden');
          }, duration);
        }
      }
    };
    
    // Inicialização do player
    function initializePlayer() {
      try {
        state.player = videojs('video', {
          controls: true,
          fluid: true,
          responsive: true,
          playbackRates: [0.5, 1, 1.25, 1.5, 2],
          html5: {
            vhs: {
              overrideNative: true
            }
          }
        });

        // Event listeners do player
        state.player.ready(() => {
          utils.log('info', 'Player inicializado com sucesso');
          statusManager.show('Player pronto', 'success', 2000);
        });

        state.player.on('error', handlePlayerError);
        state.player.on('loadstart', () => statusManager.show('Carregando stream...', 'info'));
        state.player.on('canplay', () => statusManager.show('Stream pronto para reprodução', 'success', 2000));
        state.player.on('playing', () => {
          statusManager.show('Reproduzindo', 'success', 2000);
          elements.customPlayButton.classList.add('hidden');
        });
        state.player.on('pause', () => {
          elements.customPlayButton.classList.remove('hidden');
        });
        state.player.on('waiting', () => statusManager.show('Buffering...', 'warning'));
        
        return true;
      } catch (error) {
        utils.log('error', 'Erro ao inicializar player', error);
        statusManager.show('Erro ao inicializar player', 'error');
        return false;
      }
    }
    
    // Tratamento de erros do player
    function handlePlayerError(error) {
      const playerError = state.player.error();
      let errorMessage = 'Erro desconhecido';
      
      if (playerError) {
        switch (playerError.code) {
          case 1:
            errorMessage = 'Reprodução abortada';
            break;
          case 2:
            errorMessage = 'Erro de rede';
            break;
          case 3:
            errorMessage = 'Erro de decodificação';
            break;
          case 4:
            errorMessage = 'Formato não suportado';
            break;
          default:
            errorMessage = `Erro ${playerError.code}: ${playerError.message || 'Desconhecido'}`;
        }
      }
      
      utils.log('error', 'Erro do player', playerError);
      statusManager.show(errorMessage, 'error');
      statusManager.showOverlay(`❌ ${errorMessage}\n\nTente outro canal ou verifique sua conexão.`);
      
      // Mostrar botão de play customizado
      elements.customPlayButton.classList.remove('hidden');
    }
    
    // Carregamento da lista M3U
    async function loadM3U() {
      if (state.isLoading) return;
      
      state.isLoading = true;
      statusManager.show('Carregando lista de canais...', 'info');
      
      try {
        const response = await fetch(CONFIG.M3U_URL);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const text = await response.text();
        parseM3U(text);
        
      } catch (error) {
        utils.log('error', 'Erro ao carregar M3U', error);
        statusManager.show(`Erro ao carregar lista: ${error.message}`, 'error');
        
        // Retry logic
        if (state.retryCount < CONFIG.RETRY_ATTEMPTS) {
          state.retryCount++;
          statusManager.show(`Tentativa ${state.retryCount}/${CONFIG.RETRY_ATTEMPTS} em ${CONFIG.RETRY_DELAY/1000}s...`, 'warning');
          setTimeout(() => {
            state.isLoading = false;
            loadM3U();
          }, CONFIG.RETRY_DELAY);
        } else {
          statusManager.showOverlay('❌ Não foi possível carregar a lista de canais.\n\nVerifique sua conexão com a internet.');
        }
      } finally {
        state.isLoading = false;
      }
    }
    
    // Parser M3U melhorado
    function parseM3U(text) {
      const lines = text.split('\n');
      state.channels = [];
      let current = {};

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF')) {
          const nameMatch = line.match(/,(.*)$/);
          current.name = nameMatch ? nameMatch[1].trim() : 'Canal sem nome';
          
          // Extrair informações adicionais
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          current.logo = logoMatch ? logoMatch[1] : null;
          
          const groupMatch = line.match(/group-title="([^"]+)"/);
          current.group = groupMatch ? groupMatch[1] : 'Geral';
          
        } else if (line && !line.startsWith('#')) {
          current.url = line;
          if (current.name && current.url) {
            // Adicionar informações de compatibilidade
            current.streamType = utils.detectStreamType(current.url);
            current.isHTTP = current.url.startsWith('http:');
            state.channels.push({ ...current });
          }
          current = {};
        }
      });

      renderChannelList();
      
      const channelCount = state.channels.length;
      statusManager.show(`✅ ${channelCount} canais carregados`, 'success', 3000);
      utils.log('info', `${channelCount} canais carregados com sucesso`);
      
      // Auto-play primeiro canal se configurado
      if (CONFIG.AUTO_PLAY_FIRST && channelCount > 0) {
        selectChannel(0);
      }
    }
    
    // Renderização da lista de canais
    function renderChannelList() {
      elements.channelList.innerHTML = '';
      
      if (state.channels.length === 0) {
        elements.channelList.innerHTML = '<div class="status-message status-error">Nenhum canal encontrado</div>';
        return;
      }

      state.channels.forEach((channel, index) => {
        const div = document.createElement('div');
        div.className = 'channel';
        div.textContent = channel.name;
        div.tabIndex = 0; // Para acessibilidade
        
        // Event listeners
        div.onclick = () => selectChannel(index);
        div.onkeydown = (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectChannel(index);
          }
        };
        
        elements.channelList.appendChild(div);
      });
    }
    
    // Seleção de canal
    function selectChannel(index) {
      if (index < 0 || index >= state.channels.length) return;
      
      // Remover seleção anterior
      document.querySelectorAll('.channel').forEach(ch => ch.classList.remove('active'));
      
      // Marcar canal atual como ativo
      const channelElements = document.querySelectorAll('.channel');
      if (channelElements[index]) {
        channelElements[index].classList.add('active');
        channelElements[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      
      state.currentChannelIndex = index;
      const channel = state.channels[index];
      
      utils.log('info', `Canal selecionado: ${channel.name}`, channel);
      
      // Verificar compatibilidade
      if (utils.isHTTPS() && channel.isHTTP) {
        statusManager.show(`⚠️ Canal "${channel.name}" usa HTTP`, 'warning');
        statusManager.showOverlay(`⚠️ Aviso de Segurança\n\nO canal "${channel.name}" usa HTTP e pode não funcionar em páginas HTTPS.\n\nPara melhor compatibilidade, acesse esta página via HTTP.`, 5000);
      }
      
      playChannel(channel);
    }
    
    // Reprodução de canal
    function playChannel(channel) {
      if (!state.player) {
        statusManager.show('Player não inicializado', 'error');
        return;
      }

      // Limpar players anteriores
      cleanupPlayers();
      
      statusManager.show(`🔄 Carregando: ${channel.name}`, 'info');
      
      const streamType = channel.streamType;
      utils.log('info', `Reproduzindo canal: ${channel.name} (${streamType})`, channel);
      
      // Estratégia de reprodução baseada no tipo de stream
      switch (streamType) {
        case 'hls':
          playHLS(channel);
          break;
        case 'dash':
          playDASH(channel);
          break;
        default:
          playDirect(channel);
      }
    }
    
    // Reprodução HLS
    function playHLS(channel) {
      if (Hls.isSupported()) {
        state.hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 90,
          maxBufferLength: 30,
          maxMaxBufferLength: 600,
          maxBufferSize: 60 * 1000 * 1000,
          maxBufferHole: 0.5
        });
        
        state.hls.loadSource(channel.url);
        state.hls.attachMedia(state.player.tech().el());
        
        state.hls.on(Hls.Events.MANIFEST_PARSED, () => {
          statusManager.show(`📺 HLS carregado: ${channel.name}`, 'success');
          attemptPlay();
        });
        
        state.hls.on(Hls.Events.ERROR, (event, data) => {
          utils.log('error', 'Erro HLS', data);
          if (data.fatal) {
            statusManager.show(`❌ Erro HLS: ${data.details}`, 'error');
            cleanupPlayers();
            elements.customPlayButton.classList.remove('hidden');
          }
        });
        
      } else if (state.player.tech().el().canPlayType('application/vnd.apple.mpegurl')) {
        // Safari nativo
        state.player.src({ src: channel.url, type: 'application/vnd.apple.mpegurl' });
        attemptPlay();
      } else {
        statusManager.show('❌ HLS não suportado', 'error');
        playDirect(channel); // Fallback
      }
    }
    
    // Reprodução DASH
    function playDASH(channel) {
      if (typeof dashjs !== 'undefined') {
        state.dashPlayer = dashjs.MediaPlayer().create();
        state.dashPlayer.initialize(state.player.tech().el(), channel.url, false);
        
        state.dashPlayer.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, () => {
          statusManager.show(`📺 DASH carregado: ${channel.name}`, 'success');
          attemptPlay();
        });
        
        state.dashPlayer.on(dashjs.MediaPlayer.events.ERROR, (e) => {
          utils.log('error', 'Erro DASH', e);
          statusManager.show(`❌ Erro DASH: ${e.error}`, 'error');
          elements.customPlayButton.classList.remove('hidden');
        });
      } else {
        statusManager.show('❌ DASH não suportado', 'error');
        playDirect(channel); // Fallback
      }
    }
    
    // Reprodução direta
    function playDirect(channel) {
      let mimeType = 'video/mp4'; // padrão
      
      // Detectar MIME type
      if (channel.url.includes('.ts')) {
        mimeType = 'video/mp2t';
      } else if (channel.url.includes('.mkv')) {
        mimeType = 'video/x-matroska';
      } else if (channel.url.includes('.webm')) {
        mimeType = 'video/webm';
      } else if (channel.url.includes('.avi')) {
        mimeType = 'video/x-msvideo';
      }
      
      state.player.src({ src: channel.url, type: mimeType });
      attemptPlay();
    }
    
    // Tentativa de reprodução
    function attemptPlay() {
      state.player.play().catch(err => {
        utils.log('warn', 'Autoplay bloqueado', err);
        statusManager.show('▶️ Clique para reproduzir', 'info');
        elements.customPlayButton.classList.remove('hidden');
      });
    }
    
    // Limpeza de players
    function cleanupPlayers() {
      if (state.hls) {
        state.hls.destroy();
        state.hls = null;
      }
      
      if (state.dashPlayer) {
        state.dashPlayer.reset();
        state.dashPlayer = null;
      }
    }
    
    // Event listeners
    document.addEventListener('DOMContentLoaded', () => {
      utils.log('info', `TV DO BILL iniciando... Dispositivo: ${utils.getDeviceType()}`);
      
      if (initializePlayer()) {
        loadM3U();
      }
    });
    
    // Botão de play customizado
    elements.customPlayButton.addEventListener('click', () => {
      if (state.player) {
        state.player.play().then(() => {
          elements.customPlayButton.classList.add('hidden');
        }).catch(err => {
          utils.log('error', 'Erro ao reproduzir', err);
          statusManager.show('Erro na reprodução', 'error');
        });
      }
    });
    
    // Navegação por teclado (especialmente útil para Smart TVs)
    document.addEventListener('keydown', (e) => {
      if (state.channels.length === 0) return;
      
      switch(e.key) {
        case 'ArrowUp':
          e.preventDefault();
          if (state.currentChannelIndex > 0) {
            selectChannel(state.currentChannelIndex - 1);
          }
          break;
          
        case 'ArrowDown':
          e.preventDefault();
          if (state.currentChannelIndex < state.channels.length - 1) {
            selectChannel(state.currentChannelIndex + 1);
          }
          break;
          
        case ' ':
        case 'Enter':
          e.preventDefault();
          if (state.player) {
            if (state.player.paused()) {
              state.player.play();
            } else {
              state.player.pause();
            }
          }
          break;
          
        case 'Escape':
          e.preventDefault();
          if (state.player && state.player.isFullscreen()) {
            state.player.exitFullscreen();
          }
          break;
      }
    });
    
    // Cleanup ao sair da página
    window.addEventListener('beforeunload', () => {
      cleanupPlayers();
      if (state.player) {
        state.player.dispose();
      }
    });
    
    // Tratamento de erros globais
    window.addEventListener('error', (e) => {
      utils.log('error', 'Erro global', e.error);
    });
    
    // Exposar API global para debug (apenas em desenvolvimento)
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      window.TVDOBILL = {
        state,
        utils,
        statusManager,
        selectChannel,
        loadM3U
      };
    }
  </script>
</body>
</html>
